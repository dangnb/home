<!--begin::Navbar / Header Card-->
<div class="card mb-5 mb-xl-10">
  <div class="card-body pt-9 pb-0">
    <!--begin::Details-->
    <div class="d-flex flex-wrap flex-sm-nowrap mb-3">
      <!--begin::Image-->
      <div class="me-7 mb-4">
        <div class="symbol symbol-100px symbol-lg-160px symbol-fixed position-relative">
          <img src="assets/media/avatars/300-1.jpg" alt="Max Smith" />
          <div class="position-absolute translate-middle bottom-0 start-100 mb-6 bg-success rounded-circle border border-4 border-body h-20px w-20px"></div>
        </div>
      </div>
      <!--end::Image-->

      <!--begin::Info-->
      <div class="flex-grow-1">
        <!--begin::Title-->
        <div class="d-flex justify-content-between align-items-start flex-wrap mb-2">
          <!--begin::User-->
          <div class="d-flex flex-column">
            <!--begin::Name-->
            <div class="d-flex align-items-center mb-2">
              <a href="#" class="text-gray-900 text-hover-primary fs-2 fw-bold me-1">Max Smith</a>
              <a href="#"><i class="bi bi-patch-check-fill text-primary fs-4 ms-1"></i></a>
              <span class="badge badge-light-success fw-bold ms-2 fs-8 py-1 px-3">Pro Account</span>
            </div>
            <!--end::Name-->

            <!--begin::Info items-->
            <div class="d-flex flex-wrap fw-semibold fs-6 mb-4 pe-2">
              <a href="#" class="d-flex align-items-center text-gray-500 text-hover-primary me-5 mb-2">
                <i class="bi bi-person-fill fs-4 me-1"></i> Developer
              </a>
              <a href="#" class="d-flex align-items-center text-gray-500 text-hover-primary me-5 mb-2">
                <i class="bi bi-geo-alt-fill fs-4 me-1"></i> San Francisco, USA
              </a>
              <a href="#" class="d-flex align-items-center text-gray-500 text-hover-primary mb-2">
                <i class="bi bi-envelope-fill fs-4 me-1"></i> max&#64;kt.com
              </a>
            </div>
            <!--end::Info items-->
          </div>
          <!--end::User-->

          <!--begin::Actions-->
          <div class="d-flex my-4">
            <a routerLink="/users/view/1" class="btn btn-sm btn-light me-2">
              <i class="bi bi-eye me-1"></i> View Profile
            </a>
            <a routerLink="/account/settings" class="btn btn-sm btn-primary">
              <i class="bi bi-gear me-1"></i> Edit Account
            </a>
          </div>
          <!--end::Actions-->
        </div>
        <!--end::Title-->

        <!--begin::Stats-->
        <div class="d-flex flex-wrap flex-stack">
          <!--begin::Wrapper-->
          <div class="d-flex flex-column flex-grow-1 pe-8">
            <!--begin::Stats items-->
            <div class="d-flex flex-wrap">
              <div class="border border-gray-300 border-dashed rounded min-w-125px py-3 px-4 me-6 mb-3">
                <div class="d-flex align-items-center">
                  <i class="bi bi-arrow-up text-success fs-3 me-2"></i>
                  <div class="fs-2 fw-bold text-gray-900">$4,500</div>
                </div>
                <div class="fw-semibold fs-6 text-gray-500">Earnings</div>
              </div>

              <div class="border border-gray-300 border-dashed rounded min-w-125px py-3 px-4 me-6 mb-3">
                <div class="d-flex align-items-center">
                  <i class="bi bi-arrow-down text-danger fs-3 me-2"></i>
                  <div class="fs-2 fw-bold text-gray-900">75</div>
                </div>
                <div class="fw-semibold fs-6 text-gray-500">Projects</div>
              </div>

              <div class="border border-gray-300 border-dashed rounded min-w-125px py-3 px-4 me-6 mb-3">
                <div class="d-flex align-items-center">
                  <i class="bi bi-arrow-up text-success fs-3 me-2"></i>
                  <div class="fs-2 fw-bold text-gray-900">60%</div>
                </div>
                <div class="fw-semibold fs-6 text-gray-500">Success Rate</div>
              </div>
            </div>
            <!--end::Stats items-->
          </div>
          <!--end::Wrapper-->

          <!--begin::Progress-->
          <div class="d-flex align-items-center w-200px w-sm-300px flex-column mt-3">
            <div class="d-flex justify-content-between w-100 mt-auto mb-2">
              <span class="fw-semibold fs-6 text-gray-400">Profile Completion</span>
              <span class="fw-bold fs-6">50%</span>
            </div>
            <div class="h-5px mx-3 w-100 bg-light mb-3">
              <div class="bg-success rounded h-5px" role="progressbar" style="width: 50%" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
          </div>
          <!--end::Progress-->
        </div>
        <!--end::Stats-->
      </div>
      <!--end::Info-->
    </div>
    <!--end::Details-->

    <!--begin::Navs-->
    <ul class="nav nav-stretch nav-line-tabs nav-line-tabs-2x border-transparent fs-5 fw-bold">
      <li class="nav-item mt-2">
        <a class="nav-link text-active-primary ms-0 me-10 py-5" [class.active]="currentTab === 'overview'" routerLink="/account/overview">Overview</a>
      </li>
      <li class="nav-item mt-2">
        <a class="nav-link text-active-primary ms-0 me-10 py-5" [class.active]="currentTab === 'settings'" routerLink="/account/settings">Settings</a>
      </li>
      <li class="nav-item mt-2">
        <a class="nav-link text-active-primary ms-0 me-10 py-5" [class.active]="currentTab === 'security'" routerLink="/account/security">Security</a>
      </li>
      <li class="nav-item mt-2">
        <a class="nav-link text-active-primary ms-0 me-10 py-5" [class.active]="currentTab === 'billing'" routerLink="/account/billing">Billing</a>
      </li>
      <li class="nav-item mt-2">
        <a class="nav-link text-active-primary ms-0 me-10 py-5" [class.active]="currentTab === 'statements'" routerLink="/account/statements">Statements</a>
      </li>
    </ul>
    <!--end::Navs-->
  </div>
</div>
<!--end::Navbar-->
