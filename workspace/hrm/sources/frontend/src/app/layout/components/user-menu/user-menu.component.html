<div class="d-flex align-items-center position-relative">
  <!--begin::User info trigger-->
  <div class="cursor-pointer symbol symbol-35px symbol-md-40px" (click)="toggleMenu()">
    <img [src]="authService.currentUser()?.avatar || 'assets/media/avatars/300-1.jpg'" alt="user" />
  </div>
  <!--end::User info trigger-->

  <!--begin::User account menu-->
  @if (isOpen) {
  <div
    class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-800 menu-state-bg menu-state-color fw-semibold py-4 fs-6 w-275px show position-absolute end-0 top-100 mt-2 z-index-3 bg-body shadow"
    (click)="$event.stopPropagation()">
    <!--begin::Menu item-->
    <div class="menu-item px-3">
      <div class="menu-content d-flex align-items-center px-3">
        <!--begin::Avatar-->
        <div class="symbol symbol-50px me-5">
          <img alt="Logo" [src]="authService.currentUser()?.avatar || 'assets/media/avatars/300-1.jpg'" />
        </div>
        <!--end::Avatar-->
        <!--begin::Username-->
        <div class="d-flex flex-column">
          <div class="fw-bold d-flex align-items-center fs-5">
            {{ authService.currentUser()?.name || 'User' }}
            <span class="badge badge-light-primary fw-bold fs-8 px-2 py-1 ms-2">{{ authService.currentUser()?.role ||
              'User' }}</span>
          </div>
          <a href="javascript:void(0)" class="fw-semibold text-muted text-hover-primary fs-7">
            {{ authService.currentUser()?.email || 'user@domain.com' }}
          </a>
        </div>
        <!--end::Username-->
      </div>
    </div>
    <!--end::Menu item-->

    <!--begin::Menu separator-->
    <div class="separator my-2"></div>
    <!--end::Menu separator-->

    <!--begin::Menu item-->
    <div class="menu-item px-5">
      <a routerLink="/profile/overview" (click)="closeMenu()" class="menu-link px-5">
        <i class="bi bi-person me-2 text-primary"></i> Hồ Sơ Cá Nhân
      </a>
    </div>
    <!--end::Menu item-->

    <!--begin::Menu item-->
    <div class="menu-item px-5">
      <a routerLink="/account/settings" (click)="closeMenu()" class="menu-link px-5">
        <i class="bi bi-gear me-2 text-info"></i> Cài Đặt Tài Khoản
      </a>
    </div>
    <!--end::Menu item-->

    <!--begin::Menu separator-->
    <div class="separator my-2"></div>
    <!--end::Menu separator-->

    <!--begin::Menu item (Theme Mode)-->
    <div class="menu-item px-5">
      <div class="menu-content px-5 py-2">
        <span class="fs-7 text-muted text-uppercase fw-bold">Theme Mode</span>
        <div class="d-flex align-items-center gap-2 mt-2">
          <button type="button" class="btn btn-sm btn-icon btn-light"
            [class.btn-primary]="themeService.currentTheme() === 'light'" (click)="setTheme('light')"
            title="Light Mode">
            <i class="bi bi-sun fs-4"></i>
          </button>
          <button type="button" class="btn btn-sm btn-icon btn-light"
            [class.btn-primary]="themeService.currentTheme() === 'dark'" (click)="setTheme('dark')" title="Dark Mode">
            <i class="bi bi-moon fs-4"></i>
          </button>
          <button type="button" class="btn btn-sm btn-icon btn-light"
            [class.btn-primary]="themeService.currentTheme() === 'system'" (click)="setTheme('system')"
            title="System Default">
            <i class="bi bi-laptop fs-4"></i>
          </button>
        </div>
      </div>
    </div>
    <!--end::Menu item-->

    <!--begin::Menu separator-->
    <div class="separator my-2"></div>
    <!--end::Menu separator-->

    <!--begin::Menu item-->
    <div class="menu-item px-5">
      <a href="javascript:void(0)" (click)="logout()" class="menu-link px-5 text-danger">
        <i class="bi bi-box-arrow-right text-danger me-2"></i> Sign Out
      </a>
    </div>
    <!--end::Menu item-->
  </div>
  }
  <!--end::User account menu-->
</div>
