<div id="kt_app_toolbar" class="app-toolbar py-3 py-lg-6">
  <!--begin::Toolbar container-->
  <div id="kt_app_toolbar_container" class="app-container container-fluid d-flex flex-stack">
    <!--begin::Page title-->
    <div class="page-title d-flex flex-column justify-content-center flex-wrap me-3">
      <!--begin::Title-->
      <h1 class="page-heading d-flex text-gray-900 fw-bold fs-3 flex-column justify-content-center my-0">
        {{ pageTitle }}
      </h1>
      <!--end::Title-->

      <!--begin::Breadcrumb-->
      <ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
        @for (b of breadcrumbs; track b.label; let last = $last) {
          @if (!last) {
            <li class="breadcrumb-item text-muted">
              <a [routerLink]="b.url || '/'" class="text-muted text-hover-primary">{{ b.label }}</a>
            </li>
            <li class="breadcrumb-item">
              <span class="bullet bg-gray-400 w-5px h-2px"></span>
            </li>
          } @else {
            <li class="breadcrumb-item text-muted">{{ b.label }}</li>
          }
        }
      </ul>
      <!--end::Breadcrumb-->
    </div>
    <!--end::Page title-->

    <!--begin::Actions-->
    <div class="d-flex align-items-center gap-2 gap-lg-3">
      <a routerLink="/hrm/attendances" class="btn btn-sm fw-bold btn-light-primary">
        <i class="bi bi-calendar-check me-1"></i> Bảng Công
      </a>
      <a routerLink="/hrm/employees" class="btn btn-sm fw-bold btn-primary shadow-sm">
        <i class="bi bi-person-plus-fill me-1"></i> Thêm Nhân Sự
      </a>
    </div>
    <!--end::Actions-->
  </div>
  <!--end::Toolbar container-->
</div>
